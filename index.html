    function App() {
      const [lang, setLang] = useState("hi");
      const [selectedCategory, setSelectedCategory] = useState("all");

      const [cart, setCart] = useState([]);
      const [wishlist, setWishlist] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isWishlistOpen, setIsWishlistOpen] = useState(false);
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
      const [checkoutStep, setCheckoutStep] = useState("form");
      const [isVideoModalOpen, setIsVideoModalOpen] = useState(false);
      const [isJinnyAssistantOpen, setIsJinnyAssistantOpen] = useState(false);
      const [toastMsg, setToastMsg] = useState("");

      const [couponCode, setCouponCode] = useState("");
      const [couponDiscount, setCouponDiscount] = useState(0);

      const [clientName, setClientName] = useState("");
      const [clientPhone, setClientPhone] = useState("");
      const [clientAddress, setClientAddress] = useState("");
      const [clientCity, setClientCity] = useState("");
      const [clientPincode, setClientPincode] = useState("");
      const [paymentMethod, setPaymentMethod] = useState("cod");
      const [lastOrder, setLastOrder] = useState(null);

      const [chatMessages, setChatMessages] = useState([
        { sender: "jinny", text: "नमस्ते! मैं Wish Jinny AI सहायक हूँ। सभी 7 डिपार्टमेंट्स पर आज फ्लैट 50% डिस्काउंट उपलब्ध है। मैं आपकी क्या मदद करूँ?" }
      ]);
      const [chatInput, setChatInput] = useState("");

      const [timeLeft, setTimeLeft] = useState({ h: 3, m: 42, s: 19 });
      useEffect(() => {
        const timer = setInterval(() => {
          setTimeLeft(prev => {
            if (prev.s > 0) return { ...prev, s: prev.s - 1 };
            if (prev.m > 0) return { ...prev, m: 59, s: 59 };
            if (prev.h > 0) return { h: prev.h - 1, m: 59, s: 59 };
            return { h: 3, m: 59, s: 59 };
          });
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(""), 3000);
      };

      const filteredProducts = useMemo(() => {
        return PRODUCTS.filter(p => {
          const matchCat = selectedCategory === "all" || p.categoryId === selectedCategory;
          const q = searchQuery.toLowerCase().trim();
          const matchSearch = !q || p.nameEn.toLowerCase().includes(q) || p.nameHi.toLowerCase().includes(q) || p.categoryId.toLowerCase().includes(q);
          return matchCat && matchSearch;
        }).sort((a, b) => {
          if (sortBy === "price-low") return a.discountedPrice - b.discountedPrice;
          if (sortBy === "price-high") return b.discountedPrice - a.discountedPrice;
          if (sortBy === "rating") return b.rating - a.rating;
          return -1;
        });
      }, [selectedCategory, searchQuery, sortBy]);

      const cartOriginalTotal = cart.reduce((acc, item) => acc + item.product.originalPrice * item.quantity, 0);
      const cartDiscountedTotal = cart.reduce((acc, item) => acc + item.product.discountedPrice * item.quantity, 0);
      const flat50Savings = cartOriginalTotal - cartDiscountedTotal;
      const finalCheckoutTotal = Math.max(0, cartDiscountedTotal - couponDiscount);

      const addToCart = (product) => {
        setCart(prev => {
          const idx = prev.findIndex(item => item.product.id === product.id);
          if (idx >= 0) {
            const updated = [...prev];
            updated[idx].quantity += 1;
            return updated;
          }
          return [...prev, { product, quantity: 1 }];
        });
        showToast(lang === "hi" ? `"${product.nameHi}" कार्ट में जोड़ा गया!` : `Added "${product.nameEn}" to Bag!`);
      };

      const updateQuantity = (id, delta) => {
        setCart(prev => prev.map(item => {
          if (item.product.id === id) {
            const n = item.quantity + delta;
            return n > 0 ? { ...item, quantity: n } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const removeFromCart = (id) => {
        setCart(prev => prev.filter(item => item.product.id !== id));
      };

      const toggleWishlist = (product) => {
        const exists = wishlist.some(p => p.id === product.id);
        if (exists) {
          setWishlist(prev => prev.filter(p => p.id !== product.id));
          showToast(lang === "hi" ? "विशलिस्ट से हटाया गया" : "Removed from Wishlist");
        } else {
          setWishlist(prev => [...prev, product]);
          showToast(lang === "hi" ? "विशलिस्ट में सुरक्षित किया गया" : "Saved to Wishlist");
        }
      };

      const applyCoupon = (e) => {
        e.preventDefault();
        const code = couponCode.trim().toUpperCase();
        if (code === "JINNY50" || code === "WISH50" || code === "FLAT50") {
          const extra = 250;
          setCouponDiscount(extra);
          showToast(lang === "hi" ? `कूपन ${code} लागू! ₹${extra} की अतिरिक्त छूट मिली!` : `Coupon ${code} applied! ₹${extra} extra off!`);
        } else {
          showToast(lang === "hi" ? "अमान्य कूपन। 'JINNY50' आज़माएं।" : "Invalid Code. Try 'JINNY50'");
        }
      };

      const handleConfirmOrder = (e) => {
        e.preventDefault();
        if (!clientName || !clientPhone || !clientAddress || !clientCity || !clientPincode) {
          alert(lang === "hi" ? "कृपया सभी आवश्यक जानकारी भरें।" : "Please complete all shipping fields.");
          return;
        }

        const newOrderId = "WJ-" + Math.floor(100000 + Math.random() * 900000);
        const orderData = {
          orderId: newOrderId,
          name: clientName,
          phone: clientPhone,
          address: clientAddress,
          city: clientCity,
          pincode: clientPincode,
          payment: paymentMethod,
          items: [...cart],
          total: finalCheckoutTotal,
          savings: flat50Savings + couponDiscount,
          date: new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })
        };

        setLastOrder(orderData);
        setCheckoutStep("success");
        setCart([]);
        if (window.confetti) {
          window.confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });
        }
      };

      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!chatInput.trim()) return;

        const userMsg = chatInput;
        setChatMessages(prev => [...prev, { sender: "user", text: userMsg }]);
        setChatInput("");

        setTimeout(() => {
          let reply = "";
          const lower = userMsg.toLowerCase();
          if (lower.includes("साड़ी") || lower.includes("saree")) {

                          type="text"
                          required
                          value={clientCity}
                          onChange={(e) => setClientCity(e.target.value)}
                          placeholder="उदा: जयपुर, राजस्थान"
                          className="w-full bg-white border border-[#E5E2DC] px-3 py-2 text-xs outline-none"
                        />
                      </div>
                      <div>
                        <label className="block text-[11px] font-mono text-[#73706B] mb-1">पिनकोड *</label>
                        <input
                          type="text"
                          required
                          value={clientPincode}
                          onChange={(e) => setClientPincode(e.target.value)}
                          placeholder="उदा: 302001"
                          className="w-full bg-white border border-[#E5E2DC] px-3 py-2 text-xs outline-none"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-[11px] font-mono text-[#73706B] mb-2">भुगतान का तरीका:</label>
                      <div className="grid grid-cols-2 gap-2">
                        {[
                          { id: "cod", title: "कैश ऑन डिलीवरी (COD)", desc: "सामान आने पर पैसे दें" },
                          { id: "upi", title: "UPI / QR कोड", desc: "GPay, PhonePe, Paytm" },
                        ].map(m => (
                          <div
                            key={m.id}
                            onClick={() => setPaymentMethod(m.id)}
                            className={`p-2.5 border cursor-pointer bg-white ${
                              paymentMethod === m.id ? "border-[#1A1A1A] ring-1 ring-[#1A1A1A]" : "border-[#E5E2DC]"
                            }`}
                          >
                            <div className="font-serif font-bold text-xs text-[#1A1A1A]">{m.title}</div>
                            <div className="text-[10px] font-mono text-[#73706B]">{m.desc}</div>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="p-3 bg-white border border-[#E5E2DC] text-xs font-mono space-y-1">
                      <div className="flex justify-between text-[#73706B]">
                        <span>कुल भुगतान:</span>
                        <span className="font-serif font-bold text-sm text-[#1A1A1A]">₹{finalCheckoutTotal.toLocaleString('en-IN')}</span>
                      </div>
                      <div className="text-[10px] text-[#2E7D32]">✓ पूरे भारत में फ्री डिलीवरी व 7-दिन की आसान वापसी</div>
                    </div>

                    <button
                      type="submit"
                      className="w-full py-3.5 bg-[#1A1A1A] hover:bg-[#D93D26] text-white text-xs font-mono uppercase tracking-widest transition-colors cursor-pointer"
                    >
                      ऑर्डर कन्फर्म करें (₹{finalCheckoutTotal.toLocaleString('en-IN')})
                    </button>
                  </form>
                ) : (
                  <div className="text-center py-6 space-y-4">
                    <div className="w-12 h-12 bg-white border border-[#E5E2DC] text-[#2E7D32] flex items-center justify-center mx-auto">
                      <Icon name="CheckCircle" className="w-6 h-6" />
                    </div>
                    <h3 className="font-serif font-bold text-2xl text-[#1A1A1A]">ऑर्डर सफलतापूर्वक दर्ज हुआ!</h3>
                    <p className="text-xs font-mono text-[#73706B]">
                      ऑर्डर आईडी: {lastOrder?.orderId} • जल्द डिस्पैच होगा
                    </p>

                    <div className="bg-white border border-[#E5E2DC] p-4 text-left text-xs font-mono space-y-2">
                      <div className="flex justify-between border-b border-[#E5E2DC] pb-1">
                        <span className="text-[#73706B]">ग्राहक:</span>
                        <span className="text-[#1A1A1A] font-bold">{lastOrder?.name}</span>
                      </div>
                      <div className="flex justify-between border-b border-[#E5E2DC] pb-1">
                        <span className="text-[#73706B]">पता:</span>
                        <span className="text-[#1A1A1A]">{lastOrder?.address}, {lastOrder?.city} - {lastOrder?.pincode}</span>
                      </div>
                      <div className="flex justify-between border-b border-[#E5E2DC] pb-1">
                        <span className="text-[#73706B]">भुगतान:</span>
                        <span className="text-[#1A1A1A] font-bold uppercase">{lastOrder?.payment} (₹{lastOrder?.total.toLocaleString('en-IN')})</span>
                      </div>
                    </div>

                    <div className="flex gap-3 justify-center pt-2">
                      <button onClick={() => window.print()} className="px-5 py-2.5 border border-[#1A1A1A] text-xs font-mono uppercase">
                        रसीद प्रिंट करें
                      </button>
                      <button onClick={() => { setIsCheckoutOpen(false); setCheckoutStep("form"); }} className="px-5 py-2.5 bg-[#1A1A1A] text-white text-xs font-mono uppercase">
                        दुकान पर वापस जाएं
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Jinny Concierge Assistant */}
          {isJinnyAssistantOpen && (
            <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
              <div className="bg-[#FAF9F6] border border-[#E5E2DC] max-w-lg w-full h-[500px] flex flex-col justify-between shadow-2xl">
                <div className="p-4 border-b border-[#E5E2DC] bg-white flex justify-between items-center">
                  <div className="flex items-center gap-2">
                    <Icon name="Sparkles" className="w-4 h-4 text-[#D93D26]" />
                    <h3 className="font-serif font-bold text-base text-[#1A1A1A]">Wish Jinny AI सहायक</h3>
                  </div>
                  <button onClick={() => setIsJinnyAssistantOpen(false)} className="p-1 border border-[#E5E2DC]">✕</button>
                </div>

                <div className="p-4 overflow-y-auto flex-1 space-y-3">
                  {chatMessages.map((m, idx) => (
                    <div key={idx} className={`flex ${m.sender === "user" ? "justify-end" : "justify-start"}`}>
                      <div className={`max-w-[85%] p-3 text-xs ${m.sender === "user" ? "bg-[#1A1A1A] text-white font-mono" : "bg-white border border-[#E5E2DC] text-[#1A1A1A]"}`}>
                        {m.text}
                      </div>
                    </div>
                  ))}
                </div>

                <form onSubmit={handleSendMessage} className="p-3 border-t border-[#E5E2DC] bg-white flex gap-2">
                  <input
                    type="text"
                    value={chatInput}
                    onChange={(e) => setChatInput(e.target.value)}
                    placeholder="साड़ी, ज्वेलरी, स्मार्टवॉच या 50% छूट के बारे में पूछें..."
                    className="flex-1 bg-[#FAF9F6] border border-[#E5E2DC] px-3 py-2 text-xs outline-none"
                  />
                  <button type="submit" className="px-4 py-2 bg-[#1A1A1A] text-white text-xs font-mono uppercase">
                    <Icon name="Send" className="w-3.5 h-3.5" />
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-white border-t border-[#E5E2DC] py-12 px-4 sm:px-6 lg:px-8">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
              <div>
                <h4 className="font-serif font-bold text-lg text-[#1A1A1A]">WISH JINNY</h4>
                <p className="text-xs font-mono text-[#73706B] mt-1">
                  7 कोर डिपार्टमेंट्स • पूरे भारत में फ्लैट 50% भारी छूट • सुरक्षित कैश ऑन डिलीवरी
                </p>
              </div>
              <div className="flex flex-wrap gap-4 text-xs font-mono text-[#73706B]">
                <span>100% सुरक्षित COD</span>
                <span>•</span>
                <span>7-दिन आसान वापसी</span>
                <span>•</span>
                <span>100% ओरिजिनल सामान</span>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
